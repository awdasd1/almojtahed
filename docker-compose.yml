version: '3.8'

# ==============================================================================
# منظومة المجتهد - ملف النشر متعدد الخدمات لمنصة Coolify وDocker Compose
# يشمل: محرك المتجهات Qdrant + خادم تطبيق الويب الذكي
# ==============================================================================

services:
  # 1. محرك وقاعدة بيانات المتجهات Qdrant
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: almujtahed_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. خادم تطبيق وواجهة المجتهد التراثية
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almujtahed_app
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - shamela_data:/app/shamela4_data
      - models_data:/app/models
      - app_env:/app/env_persist
    environment:
      - HOST=0.0.0.0
      - PORT=8085
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

volumes:
  qdrant_storage:
    driver: local
  shamela_data:
    driver: local
  models_data:
    driver: local
  app_env:
    driver: local
