<!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>خريطة ذهنية تفاعلية</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            body {{
                margin: 0;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: #0f172a;
                color: #f8fafc;
            }}
            .node circle {{
                cursor: pointer;
                stroke-width: 2.5px;
                transition: all 0.3s ease;
            }}
            .node text {{
                font-size: 13px;
                font-weight: 500;
                fill: #e2e8f0;
                paint-order: stroke;
                stroke: #0f172a;
                stroke-width: 3px;
                stroke-linecap: butt;
                stroke-linejoin: miter;
            }}
            .link {{
                fill: none;
                stroke: #334155;
                stroke-width: 1.8px;
                transition: stroke 0.3s ease;
            }}
            .controls {{
                position: absolute;
                top: 20px;
                right: 20px;
                background: rgba(30, 41, 59, 0.85);
                backdrop-filter: blur(8px);
                padding: 12px 18px;
                border-radius: 10px;
                border: 1px solid #334155;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                font-size: 13px;
                line-height: 1.6;
            }}
        </style>
    </head>
    <body>
        <div class="controls">
            <strong>💡 تعليمات التحكم:</strong><br>
            • انقر على أي نقطة لطي أو فرد الفروع.<br>
            • استخدم عجلة الفأرة للتكبير والتصغير (Zoom).<br>
            • اسحب الخريطة للتحريك في أي اتجاه (Pan).
        </div>

        <svg id="mindmap"></svg>

        <script>
            const rawData = {"name": "الذكاء الاصطناعي", "children": [{"name": "تعلم الآلة (Machine Learning)", "children": [{"name": "التعلم الخاضع للإشراف (Supervised)", "children": [{"name": "التصنيف (Classification)"}, {"name": "الانحدار (Regression)"}]}, {"name": "التعلم غير الخاضع للإشراف (Unsupervised)", "children": [{"name": "العنقدة (Clustering)"}, {"name": "تقليل الأبعاد (Dimensionality Reduction)"}]}, {"name": "التعلم التعزيزي (Reinforcement Learning)"}]}, {"name": "معالجة اللغات الطبيعية (NLP)", "children": [{"name": "نماذج اللغات الضخمة (LLMs)"}, {"name": "تحليل المشاعر (Sentiment Analysis)"}, {"name": "الترجمة الآلية (Machine Translation)"}]}, {"name": "الرؤية الحاسوبية (Computer Vision)", "children": [{"name": "التعرف على الكائنات (Object Detection)"}, {"name": "تجزئة الصور (Image Segmentation)"}, {"name": "توليد الصور (Generative Vision)"}]}, {"name": "البنية التحتية والبيانات", "children": [{"name": "قواعد البيانات الشعاعية (Vector DBs)"}, {"name": "أطر العمل (PyTorch, TensorFlow)"}, {"name": "الحوسبة السحابية و GPU"}]}]};

            const width = window.innerWidth;
            const height = window.innerHeight;

            const svg = d3.select("#mindmap")
                .attr("width", width)
                .attr("height", height);

            const g = svg.append("g")
                .attr("transform", "translate(" + (width / 4) + "," + (height / 2) + ")");

            // دعم السحب والتقريب
            const zoom = d3.zoom()
                .scaleExtent([0.2, 3])
                .on("zoom", (event) => g.attr("transform", event.transform));
            svg.call(zoom);

            const tree = d3.tree().nodeSize([45, 240]);
            let root = d3.hierarchy(rawData, d => d.children);

            root.x0 = height / 2;
            root.y0 = 0;

            // طي بعض الفروع الفرعية افتراضياً للترتيب
            if (root.children) {{
                root.children.forEach(collapseAfterLevel1);
            }}

            function collapseAfterLevel1(d) {{
                if (d.children) {{
                    d._children = d.children;
                    d._children.forEach(collapseAfterLevel1);
                    d.children = null;
                }}
            }}

            let i = 0;
            update(root);

            function update(source) {{
                const treeData = tree(root);
                const nodes = treeData.descendants();
                const links = treeData.links();

                // ضبط عمق الفروع أفقياً
                nodes.forEach(d => {{ d.y = d.depth * 220; }});

                // 1. التعامل مع العقد (Nodes)
                const node = g.selectAll('g.node')
                    .data(nodes, d => d.id || (d.id = ++i));

                const nodeEnter = node.enter().append('g')
                    .attr('class', 'node')
                    .attr("transform", d => `translate(${{source.y0}},${{source.x0}})`)
                    .on('click', (event, d) => {{
                        if (d.children) {{
                            d._children = d.children;
                            d.children = null;
                        }} else {{
                            d.children = d._children;
                            d._children = null;
                        }}
                        update(d);
                    }});

                nodeEnter.append('circle')
                    .attr('r', 1e-6)
                    .style("fill", d => d._children ? "#38bdf8" : "#1e293b")
                    .style("stroke", d => d.depth === 0 ? "#f59e0b" : "#38bdf8");

                nodeEnter.append('text')
                    .attr("dy", ".35em")
                    .attr("x", d => d.children || d._children ? -14 : 14)
                    .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                    .text(d => d.data.name)
                    .style("fill-opacity", 1e-6);

                const nodeUpdate = nodeEnter.merge(node);

                nodeUpdate.transition()
                    .duration(400)
                    .attr("transform", d => `translate(${{d.y}},${{d.x}})`);

                nodeUpdate.select('circle')
                    .attr('r', 7)
                    .style("fill", d => d._children ? "#38bdf8" : "#0f172a")
                    .style("stroke", d => d.depth === 0 ? "#f59e0b" : "#38bdf8");

                nodeUpdate.select('text')
                    .style("fill-opacity", 1);

                const nodeExit = node.exit().transition()
                    .duration(400)
                    .attr("transform", d => `translate(${{source.y}},${{source.x}})`)
                    .remove();

                nodeExit.select('circle').attr('r', 1e-6);
                nodeExit.select('text').style('fill-opacity', 1e-6);

                // 2. التعامل مع الروابط المنحنية (Links)
                const link = g.selectAll('path.link')
                    .data(links, d => d.target.id);

                const linkEnter = link.enter().insert('path', "g")
                    .attr("class", "link")
                    .attr('d', d => {{
                        const o = {{x: source.x0, y: source.y0}};
                        return diagonal(o, o);
                    }});

                const linkUpdate = linkEnter.merge(link);

                linkUpdate.transition()
                    .duration(400)
                    .attr('d', d => diagonal(d.source, d.target));

                link.exit().transition()
                    .duration(400)
                    .attr('d', d => {{
                        const o = {{x: source.x, y: source.y}};
                        return diagonal(o, o);
                    }})
                    .remove();

                nodes.forEach(d => {{
                    d.x0 = d.x;
                    d.y0 = d.y;
                }});

                function diagonal(s, d) {{
                    return `M ${{s.y}} ${{s.x}}
                            C ${{(s.y + d.y) / 2}} ${{s.x}},
                              ${{(s.y + d.y) / 2}} ${{d.x}},
                              ${{d.y}} ${{d.x}}`;
                }}
            }}
        </script>
    </body>
    </html>
